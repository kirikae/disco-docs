name: Build knative.dev offline docs

on:
  push:
    branches: [main]
    paths:
      - 'knative-dev/**'
      - '.github/workflows/build-knative-dev.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  # Mints the OIDC token cosign exchanges for a Fulcio signing
  # certificate, which is what binds the keyless signature to this
  # repository and workflow. Without it the signing step fails.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      # Knative's docs build (hack/build.sh) stitches together multiple
      # release branches via `mike`-less `git worktree` + external curls to
      # sibling repos (knative/serving, knative/eventing) for API reference
      # pages. We build a single version (the `main`/development tip) here
      # for a simpler, more reliable first pass instead of replicating that
      # whole pipeline.
      - name: Checkout official Knative docs repository
        uses: actions/checkout@v4
        with:
          repository: knative/docs
          path: knative-dev/knative-docs
          fetch-depth: 1

      - name: Prepare tags and environment
        id: prep
        run: |
          cd knative-dev/knative-docs
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push
        uses: ./.github/actions/build-and-push-offline-docs
        with:
          image: knative-offline-docs
          context: ./knative-dev
          version-tag: ${{ env.COMMIT_SHA }}
          # Optional second, key-based signature; the build still
          # succeeds (keyless only) when these are not set.
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
