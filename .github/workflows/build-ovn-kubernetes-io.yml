name: Build ovn-kubernetes.io offline docs

on:
  push:
    branches: [main]
    paths:
      - 'ovn-kubernetes-io/**'
      - '.github/workflows/build-ovn-kubernetes-io.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Checkout official ovn-kubernetes repository
        uses: actions/checkout@v4
        with:
          repository: ovn-kubernetes/ovn-kubernetes
          path: ovn-kubernetes-io/ovn-kubernetes-src
          fetch-depth: 1

      - name: Prepare tags and environment
        id: prep
        run: |
          cd ovn-kubernetes-io/ovn-kubernetes-src
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push
        uses: ./.github/actions/build-and-push-offline-docs
        with:
          image: ovn-kubernetes-offline-docs
          context: ./ovn-kubernetes-io
          version-tag: ${{ env.COMMIT_SHA }}
