name: Build konpyutaika.github.io/nifikop offline docs

on:
  push:
    branches: [main]
    paths:
      - 'konpyutaika-github-io-nifikop/**'
      - '.github/workflows/build-konpyutaika-github-io-nifikop.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  # Mints the OIDC token cosign exchanges for a Fulcio signing
  # certificate, which is what binds the keyless signature to this
  # repository and workflow. Without it the signing step fails.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Checkout official nifikop repository
        uses: actions/checkout@v4
        with:
          repository: konpyutaika/nifikop
          path: konpyutaika-github-io-nifikop/nifikop-src
          fetch-depth: 1

      - name: Prepare tags and environment
        id: prep
        run: |
          cd konpyutaika-github-io-nifikop/nifikop-src
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push
        uses: ./.github/actions/build-and-push-offline-docs
        with:
          image: nifikop-offline-docs
          context: ./konpyutaika-github-io-nifikop
          version-tag: ${{ env.COMMIT_SHA }}
          # Optional second, key-based signature; the build still
          # succeeds (keyless only) when these are not set.
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
