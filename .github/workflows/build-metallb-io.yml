name: Build metallb.io offline docs

on:
  push:
    branches: [main]
    paths:
      - 'metallb-io/**'
      - '.github/workflows/build-metallb-io.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Checkout official metallb repository
        uses: actions/checkout@v4
        with:
          repository: metallb/metallb
          path: metallb-io/metallb-src
          fetch-depth: 1

      - name: Prepare tags and environment
        id: prep
        run: |
          cd metallb-io/metallb-src
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push
        uses: ./.github/actions/build-and-push-offline-docs
        with:
          image: metallb-offline-docs
          context: ./metallb-io
          version-tag: ${{ env.COMMIT_SHA }}
