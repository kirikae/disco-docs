name: Build thanos.io offline docs

on:
  push:
    branches: [main]
    paths:
      - 'thanos-io/**'
      - '.github/workflows/build-thanos-io.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Checkout official Thanos repository
        uses: actions/checkout@v4
        with:
          repository: thanos-io/thanos
          path: thanos-io/thanos-src
          fetch-depth: 1

      - name: Prepare tags and environment
        id: prep
        run: |
          cd thanos-io/thanos-src
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push
        uses: ./.github/actions/build-and-push-offline-docs
        with:
          image: thanos-offline-docs
          context: ./thanos-io
          version-tag: ${{ env.COMMIT_SHA }}
