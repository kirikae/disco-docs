name: Build opentelemetry.io offline docs

on:
  push:
    branches: [main]
    paths:
      - 'opentelemetry-io/**'
      - '.github/workflows/build-opentelemetry-io.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Checkout official OpenTelemetry website repository
        uses: actions/checkout@v4
        with:
          repository: open-telemetry/opentelemetry.io
          path: opentelemetry-io/opentelemetry-website
          submodules: true
          fetch-depth: 1

      - name: Prepare tags and environment
        id: prep
        run: |
          cd opentelemetry-io/opentelemetry-website
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push
        uses: ./.github/actions/build-and-push-offline-docs
        with:
          image: opentelemetry-offline-docs
          context: ./opentelemetry-io
          version-tag: ${{ env.COMMIT_SHA }}
