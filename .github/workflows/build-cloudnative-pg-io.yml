name: Build cloudnative-pg.io offline docs

on:
  push:
    branches: [main]
    paths:
      - 'cloudnative-pg-io/**'
      - '.github/workflows/build-cloudnative-pg-io.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Checkout CloudNativePG docs repository
        uses: actions/checkout@v4
        with:
          repository: cloudnative-pg/docs-new
          path: cloudnative-pg-io/cnpg-src
          fetch-depth: 1

      - name: Prepare tags and environment
        id: prep
        run: |
          cd cloudnative-pg-io/cnpg-src
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push
        uses: ./.github/actions/build-and-push-offline-docs
        with:
          image: cloudnative-pg-offline-docs
          context: ./cloudnative-pg-io
          version-tag: ${{ env.COMMIT_SHA }}
