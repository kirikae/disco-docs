name: Build prometheus.io offline docs

on:
  push:
    branches: [main]
    paths:
      - 'prometheus-io/**'
      - '.github/workflows/build-prometheus-io.yml'

  # Build on PRs that touch this site, but never publish -- the action is
  # passed publish: false below. Catches a broken build before merge instead
  # of after it, when only the nightly run would have found it.
  pull_request:
    paths:
      - 'prometheus-io/**'
      - '.github/workflows/build-prometheus-io.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  # Mints the OIDC token cosign exchanges for a Fulcio signing
  # certificate, which is what binds the keyless signature to this
  # repository and workflow. Without it the signing step fails.
  id-token: write

concurrency:
  # A PR build is minutes of CI per site, so let a newer push to the same
  # branch cancel the previous run. Publishing runs are never cancelled: on
  # main and on the nightly schedule each one must finish and sign.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Checkout official Prometheus docs repository
        uses: actions/checkout@v4
        with:
          repository: prometheus/docs
          path: prometheus-io/prometheus-docs
          fetch-depth: 1

      - name: Prepare tags and environment
        id: prep
        run: |
          cd prometheus-io/prometheus-docs
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push
        uses: ./.github/actions/build-and-push-offline-docs
        with:
          image: prometheus-offline-docs
          context: ./prometheus-io
          version-tag: ${{ env.COMMIT_SHA }}
          # A pull_request build proves the image builds and serves; only
          # main and the schedule publish and sign it.
          publish: ${{ github.event_name != 'pull_request' }}
          # The build's pre-build scripts fetch versioned docs and release
          # metadata for the Prometheus/Alertmanager/exporter repos from the
          # GitHub API; passing a token raises the rate limit for this from
          # 60/hour to 5000/hour. Passed as a BuildKit secret (consumed via
          # `RUN --mount=type=secret` in the Dockerfile) rather than a
          # build-arg, so it's never baked into an image layer or the pushed
          # layer-cache history.
          build-secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          # Optional second, key-based signature; the build still
          # succeeds (keyless only) when these are not set.
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
