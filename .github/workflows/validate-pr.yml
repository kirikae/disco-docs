name: Validate pull request

# Fast, build-free PR validation.
#
# This is the first of two PR signals, and the cheap one: it validates
# *statically* whatever a PR touches -- and only what it touches -- in seconds.
# Dockerfile syntax and base images, the nginx config, the hardened-runtime
# invariants, workflow lint.
#
# The second signal is the real build. Each per-site build workflow now also runs
# on pull_request, filtered to its own paths, and passes publish: false to the
# shared action -- so a PR builds the image, smoke-tests that it serves, and
# throws it away without pushing or signing anything. That is minutes of CI per
# affected site rather than seconds, which is why it stayed out of this workflow:
# these checks should keep failing fast on the obvious mistakes.
#
# Between them, a PR now proves the docs actually build before it merges. The
# checks here remain worth having because they name the specific rule that was
# broken, which a build failure often does not.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.detect.outputs.sites }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          # Full history so the PR's merge base is resolvable below.
          fetch-depth: 0

      - name: Detect changed site directories
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "Changed files:"
          echo "${changed}" | awk '{ print "  " $0 }'

          # A "site" is a top-level directory containing a Dockerfile -- that's
          # the unit each build workflow builds. Consider only directories this
          # PR touched that still have a Dockerfile at the head commit, so a PR
          # that deletes or renames a site doesn't fail trying to validate it.
          sites=$(
            echo "${changed}" \
              | awk -F/ 'NF > 1 { print $1 }' \
              | sort -u \
              | while read -r dir; do
                  case "${dir}" in .*) continue ;; esac
                  if [ -f "${dir}/Dockerfile" ]; then echo "${dir}"; fi
                done \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )
          echo "sites=${sites}" >> "${GITHUB_OUTPUT}"
          echo "Sites to validate: ${sites}"

          if echo "${changed}" | grep -q '^\.github/'; then
            echo "workflows=true" >> "${GITHUB_OUTPUT}"
          else
            echo "workflows=false" >> "${GITHUB_OUTPUT}"
          fi

  validate-site:
    name: Validate ${{ matrix.site }}
    needs: detect-changes
    if: needs.detect-changes.outputs.sites != '[]' && needs.detect-changes.outputs.sites != ''
    runs-on: ubuntu-latest
    strategy:
      # One broken site shouldn't mask the state of the others.
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.detect-changes.outputs.sites) }}
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `--check` runs the Dockerfile through the frontend's parser and linter
      # and resolves every base image, without executing a single build step.
      # Catches syntax errors, unresolvable/typo'd FROM tags and lint rule
      # violations in a few seconds.
      - name: Check Dockerfile
        env:
          SITE: ${{ matrix.site }}
        run: docker buildx build --check "./${SITE}"

      - name: Check nginx config
        env:
          SITE: ${{ matrix.site }}
          RUNTIME_IMAGE: registry.access.redhat.com/hi/nginx:latest
        run: |
          set -euo pipefail

          conf="${SITE}/default.conf"
          if [ ! -f "${conf}" ]; then
            echo "::error::${conf} is missing -- every site serves its built docs through nginx."
            exit 1
          fi

          # Mount the config where the runtime image's stock nginx.conf includes
          # it from, so `nginx -t` validates it in the same shape it's used in --
          # and validate it against the image that actually serves it, so an
          # nginx version difference can't hide a problem until after merge. The
          # hardened image's entrypoint is nginx itself, hence bare arguments
          # rather than a "nginx -t" command.
          docker run --rm \
            -v "${PWD}/${conf}:/etc/nginx/conf.d/default.conf:ro" \
            "${RUNTIME_IMAGE}" -t -c /etc/nginx/nginx.conf

      # The runtime image is distroless and serves as UID 65532, which rules out
      # three things a site Dockerfile might otherwise reasonably do. Each of
      # them fails at run time rather than build time -- a container that exits
      # immediately, or a site that 404s every page -- so catch them statically.
      - name: Check the site targets the hardened runtime correctly
        env:
          SITE: ${{ matrix.site }}
        run: |
          set -euo pipefail

          df="${SITE}/Dockerfile"
          conf="${SITE}/default.conf"
          rc=0

          # Everything from the last FROM onwards is the stage that ships.
          final_stage=$(awk '/^FROM /{ buf = "" } { buf = buf $0 "\n" } END { printf "%s", buf }' "${df}")

          if ! grep -q '^FROM registry\.access\.redhat\.com/hi/nginx' <<<"${final_stage}"; then
            echo "::error file=${df}::The final stage must be FROM registry.access.redhat.com/hi/nginx:latest (the Red Hat Hardened Images nginx every site serves from)."
            rc=1
          fi

          # No shell in the image, so a RUN here cannot execute.
          if grep -qE '^RUN ' <<<"${final_stage}"; then
            echo "::error file=${df}::The final stage has a RUN step, but the hardened nginx image is distroless -- there is no shell to run it. Do the work in the builder stage instead."
            rc=1
          fi

          # The image's own CMD carries nginx's flags after its /usr/sbin/nginx
          # entrypoint; overriding CMD replaces them and appends a stray argument.
          if grep -qE '^CMD ' <<<"${final_stage}"; then
            echo "::error file=${df}::The final stage sets CMD. The hardened nginx image supplies its own entrypoint and flags -- remove the CMD."
            rc=1
          fi

          # Non-root nginx cannot bind a privileged port.
          if ! grep -qE '^\s*listen\s+8080;' "${conf}"; then
            echo "::error file=${conf}::Must 'listen 8080;' -- the hardened nginx image runs as UID 65532 and cannot bind port 80."
            rc=1
          fi

          exit "${rc}"

      # Guards against adding a site directory but forgetting to wire up the
      # workflow that builds it -- which would otherwise fail silently, since
      # a site nothing builds simply never produces an image -- and against
      # wiring it up in a way that publishes the image unsigned.
      - name: Check the site is wired into a build workflow
        env:
          SITE: ${{ matrix.site }}
        run: |
          set -euo pipefail

          wf=$(grep -rlF "context: ./${SITE}" .github/workflows/ || true)
          if [ -z "${wf}" ]; then
            echo "::error::No workflow in .github/workflows builds ./${SITE}."
            echo "::error::Add a build-${SITE}.yml modelled on an existing per-site workflow."
            exit 1
          fi

          rc=0
          for f in ${wf}; do
            # The keyless signature is minted from an OIDC token the job has to
            # be granted. Missing it does not fail the build until the signing
            # step runs, minutes into a push to main.
            if ! grep -q 'id-token: write' "${f}"; then
              echo "::error file=${f}::Missing 'id-token: write' under permissions; cosign cannot mint a keyless signing certificate without it."
              rc=1
            fi
            # Without a pull_request trigger the site is never built before a
            # merge, which is the gap this whole workflow exists to close.
            if ! grep -qE '^  pull_request:' "${f}"; then
              echo "::error file=${f}::No 'pull_request:' trigger, so this site is never built on a PR. Copy the trigger from an existing site workflow."
              rc=1
            fi
            # ...and with the trigger but without the gate, a PR would publish
            # and sign an image built from unreviewed code.
            #
            # Matched without writing the expression delimiters literally: an
            # Actions expression inside a run: block is interpolated before bash
            # sees it, so a pattern containing them would silently become a search
            # for "publish: false" and pass for the wrong reason.
            if ! grep -qE "publish:.*github\.event_name != 'pull_request'" "${f}"; then
              echo "::error file=${f}::Does not gate publishing on the event. Pass publish: (github.event_name != 'pull_request') to the build action, or a PR build would push and sign."
              rc=1
            fi
            # Composite actions cannot read the secrets context, so each caller
            # has to forward the key. Omitting it silently drops the key-pair
            # signature -- the one that makes offline verification possible.
            if ! grep -q 'cosign-private-key:' "${f}"; then
              echo "::error file=${f}::Does not pass cosign-private-key/cosign-password to the build action, so the image would publish without its key-pair signature."
              rc=1
            fi
          done
          exit "${rc}"

  validate-workflows:
    name: Lint workflows
    needs: detect-changes
    if: needs.detect-changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      # actionlint validates workflow schema, expressions and -- most usefully
      # here -- the inputs passed to the shared build-and-push composite
      # action, so a typo'd or missing input fails the PR instead of the build.
      #
      # shellcheck integration is off: on this repo it only reports pre-existing
      # SC2086 style hits on the `... >> $GITHUB_ENV` lines that every site
      # workflow uses, which would make the check permanently red.
      - name: Run actionlint
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${PWD}:/repo:ro" \
            -w /repo \
            rhysd/actionlint:1.7.12 -shellcheck= -color
