name: Build docs.opensearch.org offline docs
on:
  push:
    branches: [main]
    paths:
      - 'docs-opensearch-org/**'
      - '.github/workflows/build-docs-opensearch-org.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
      - name: Checkout official OpenSearch documentation-website repository
        uses: actions/checkout@v4
        with:
          repository: opensearch-project/documentation-website
          path: docs-opensearch-org/opensearch-src
          fetch-depth: 1
      - name: Prepare tags and environment
        id: prep
        run: |
          cd docs-opensearch-org/opensearch-src
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Build and push
        uses: ./.github/actions/build-and-push-offline-docs
        with:
          image: opensearch-offline-docs
          context: ./docs-opensearch-org
          version-tag: ${{ env.COMMIT_SHA }}
