name: Build and push offline docs image
description: >
  Shared tail for the offline-docs site builds: set up Buildx, log in to GHCR,
  build+push the site image with the standard :latest and :<version> tags plus
  registry-backed BuildKit cache, and sign the pushed manifest with cosign.
inputs:
  image:
    description: Image name under ghcr.io/<owner>/ (e.g. "istio-offline-docs").
    required: true
  context:
    description: Docker build context path (e.g. "./istio-io").
    required: true
  version-tag:
    description: Immutable tag for this build (typically the upstream short commit SHA).
    required: true
  build-args:
    description: Optional newline-separated build args forwarded to docker build.
    required: false
    default: ""
  build-secrets:
    description: Optional newline-separated BuildKit secrets (id=VALUE) forwarded to docker build.
    required: false
    default: ""
  cosign-private-key:
    description: >
      Optional cosign private key (the contents of cosign.key) used for the
      second, key-based signature. Callers pass secrets.COSIGN_PRIVATE_KEY.
      When empty, only the keyless signature is made, so builds keep working
      before the key exists. See README.md for generating and storing it.
    required: false
    default: ""
  cosign-password:
    description: >
      Passphrase for cosign-private-key. Callers pass secrets.COSIGN_PASSWORD.
      Required (possibly as an empty string) whenever cosign-private-key is set.
    required: false
    default: ""
  cosign-version:
    description: >
      cosign release to install, pinned so a signing behaviour change never
      arrives unannounced. Coupled to the installer version below: cosign 3.x
      can only be installed by cosign-installer v4+, because 3.x replaced the
      detached .sig the older installer verifies with a .sigstore.json bundle.
      Moving this back to a 2.x release means moving the installer back too.
    required: false
    default: v3.1.3
  publish:
    description: >
      Whether to publish the result. "true" (the default) pushes both tags,
      writes the registry build cache and signs the manifest — what the per-site
      workflows want on main and on the nightly schedule. "false" builds the
      image, loads it locally and smoke-tests it, then throws it away: nothing is
      pushed, no cache is written and nothing is signed. PR validation uses
      "false" so a broken build is caught before merge instead of by the next
      nightly run.
    required: false
    default: "true"
outputs:
  digest:
    description: >
      Digest of the pushed manifest, which is what the signatures are made over.
      Empty when publish is "false", since nothing was pushed to have a digest.
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Compute lowercase owner
      id: owner
      shell: bash
      run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    # When not publishing, the image is loaded into the local docker daemon
    # instead of pushed, so the smoke test below has something to run. cache-to
    # is dropped in that mode as well: a pull_request build has a read-only token
    # and has no business rewriting the shared build cache either way. cache-from
    # is kept, which is what makes a PR build cheap -- most layers come straight
    # from the cache the last publish wrote.
    - name: Build image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        push: ${{ inputs.publish == 'true' }}
        load: ${{ inputs.publish != 'true' }}
        build-args: ${{ inputs.build-args }}
        secrets: ${{ inputs.build-secrets }}
        tags: |
          ghcr.io/${{ steps.owner.outputs.owner }}/${{ inputs.image }}:latest
          ghcr.io/${{ steps.owner.outputs.owner }}/${{ inputs.image }}:${{ inputs.version-tag }}
        cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.owner }}/${{ inputs.image }}:buildcache
        cache-to: ${{ inputs.publish == 'true' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max', steps.owner.outputs.owner, inputs.image) || '' }}

    # A PR build is only worth the CI minutes if the result is actually exercised,
    # so start the image and check it serves. This catches the class of fault a
    # successful build cannot: a docroot the unprivileged runtime cannot read
    # (which surfaces as 403), a try_files rule that misses index.html, or a
    # docroot assembled at the wrong path. Publishing runs skip it -- there the
    # image is pushed rather than loaded, and the nightly schedule would surface
    # a regression anyway.
    - name: Smoke-test the built image
      if: inputs.publish != 'true'
      shell: bash
      env:
        IMAGE_REF: ghcr.io/${{ steps.owner.outputs.owner }}/${{ inputs.image }}:latest
      run: |
        set -euo pipefail

        cid=$(docker run -d -p 8080:8080 "${IMAGE_REF}")
        trap 'docker logs "${cid}" 2>&1 | tail -20; docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT

        # The runtime is distroless with no healthcheck, so poll rather than sleep.
        # Poll for any HTTP response rather than a successful one (no curl
        # --fail): "nginx never came up" and "nginx answered 403" are different
        # faults, and collapsing them would report a timeout for the far more
        # likely unreadable-docroot case, hiding the useful message below.
        code=000
        for _ in $(seq 1 30); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
          [ "${code}" != "000" ] && break
          sleep 1
        done
        if [ "${code}" = "000" ]; then
          echo "::error::${IMAGE_REF} did not respond on 8080 within 30s -- nginx"
          echo "::error::probably failed to start. Container log follows."
          exit 1
        fi

        echo "GET / -> ${code}"
        if [ "${code}" != "200" ]; then
          echo "::error::GET / returned ${code}, expected 200. A 403 here usually means"
          echo "::error::the docroot is not world-readable -- check the builder stage's chmod."
          exit 1
        fi

        # Confirm it really is running unprivileged, since the whole 8080/chmod
        # design depends on that and a base-image change could quietly undo it.
        uid=$(docker inspect --format '{{.Config.User}}' "${IMAGE_REF}")
        echo "runs as UID: ${uid:-<root>}"
        if [ "${uid}" != "65532" ]; then
          echo "::error::expected the image to run as UID 65532, got '${uid:-<root>}'."
          exit 1
        fi

    # --- Signing ---
    #
    # Everything below signs the *digest*, never a tag. :latest is reattached on
    # every nightly build, so a tag-scoped signature would go stale the moment
    # the next build runs; a digest names exactly these bytes forever. Both tags
    # pushed above point at this one manifest, so one signature covers both.
    #
    # Two signatures are made, because they answer different questions:
    #
    #   Keyless (Sigstore/Fulcio, via the Actions OIDC token) proves *what built
    #   the image* -- the certificate records this repository, workflow and
    #   commit, and the signature is recorded in the public Rekor transparency
    #   log. There is no key to store, leak or rotate. Verifying it means
    #   asserting an identity, so it needs Sigstore's roots and is most natural
    #   online.
    #
    #   Key-based proves *that the holder of our key released it*. It carries no
    #   build provenance, but it verifies against a single public key file with
    #   no Sigstore infrastructure involved, which is what makes it usable inside
    #   a disconnected environment -- the whole point of the images in this repo.
    #
    # README.md documents the verification commands for both, including the
    # airgapped path.
    # Pinned to v4.x deliberately, and to an exact patch because the project
    # publishes no floating v4 tag.
    #
    # The v3 installer verifies the binary it downloads against a detached
    # `cosign-linux-amd64.sig`. cosign 2.x publishes that; cosign 3.x publishes a
    # `cosign-linux-amd64.sigstore.json` bundle instead and no `.sig` at all, so
    # `@v3` asking for a 3.x release 404s on the signature and fails the step with
    # curl's exit 22. v4 verifies the bundle, so the installer major and the
    # cosign major have to move together.
    #
    # Also check that a release actually has assets before bumping
    # `cosign-version`: some 3.x tags (v3.0.0 and v3.1.0, for two) exist with no
    # published binaries at all, which fails the same way for a different reason.
    #
    # This step is deliberately NOT gated on `publish`: it is seconds of CI, and
    # installing cosign is precisely what broke once (see above), in a change that
    # touched no site directory. Running it on PRs too means that class of fault
    # fails a check instead of every publish after the merge.
    - name: Install cosign
      uses: sigstore/cosign-installer@v4.1.2
      with:
        cosign-release: ${{ inputs.cosign-version }}

    - name: Check cosign is usable
      shell: bash
      run: cosign version

    - name: Sign the image (keyless, Sigstore OIDC)
      if: inputs.publish == 'true'
      shell: bash
      env:
        # Nothing authenticates here beyond the docker/login-action credentials
        # already in the runner's registry config plus the workflow's OIDC token,
        # which is why the calling workflow needs `id-token: write`.
        IMAGE_DIGEST: ghcr.io/${{ steps.owner.outputs.owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        cosign sign --yes --bundle "${RUNNER_TEMP}/keyless.bundle" "${IMAGE_DIGEST}"

    - name: Sign the image (key pair)
      if: inputs.publish == 'true' && inputs.cosign-private-key != ''
      shell: bash
      env:
        # Passed via env:// rather than a file so the key is never written to the
        # runner's disk. It arrives here as a secret, so Actions keeps masking it.
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign-private-key }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
        IMAGE_DIGEST: ghcr.io/${{ steps.owner.outputs.owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
          --bundle "${RUNNER_TEMP}/keyed.bundle" "${IMAGE_DIGEST}"

    # Both signatures live in GHCR next to the image (as a sha256-<digest>.sig
    # tag) and that is what `cosign verify` reads, so these bundles are not
    # required for verification -- `cosign save` carries the signatures along
    # with the image, which is the documented way to verify inside an airgap.
    # They are kept as a small, immutable per-run record of what this build
    # signed, useful when reconstructing after the fact which digest a given
    # workflow run published.
    - name: Upload signature bundles
      if: inputs.publish == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: cosign-bundles-${{ inputs.image }}-${{ inputs.version-tag }}
        path: ${{ runner.temp }}/*.bundle
        if-no-files-found: error
        retention-days: 30

    # Puts the digest and a ready-to-paste verify command on the run's summary
    # page. Without this, recovering which digest a past nightly build published
    # means digging through the build log.
    - name: Summarise what was signed
      if: inputs.publish == 'true'
      shell: bash
      env:
        # Every value arrives through env rather than being interpolated into the
        # script body, so nothing from a context can be parsed as shell.
        IMAGE: ghcr.io/${{ steps.owner.outputs.owner }}/${{ inputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
        VERSION_TAG: ${{ inputs.version-tag }}
        REPO: ${{ github.repository }}
        KEYED: ${{ inputs.cosign-private-key != '' && 'yes' || 'no -- COSIGN_PRIVATE_KEY secret is not set' }}
      run: |
        set -euo pipefail
        {
          echo "### ${IMAGE}"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Digest | \`${DIGEST}\` |"
          echo "| Tags | \`latest\`, \`${VERSION_TAG}\` |"
          echo "| Keyless signature | yes |"
          echo "| Key-pair signature | ${KEYED} |"
          echo
          echo '```'
          echo "cosign verify \\"
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
          echo "  --certificate-identity-regexp '^https://github.com/${REPO}/' \\"
          echo "  ${IMAGE}@${DIGEST}"
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"
