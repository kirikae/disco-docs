# Docusaurus emits a directory per page containing index.html, and this site's
# sitePlugin.js additionally writes a flat "<page>.html" beside each one, so both
# /docs/x/ and /docs/x resolve.
#
# Note the absence of a bare "$uri/" from try_files, which the other sites in
# this repo carry. "$uri/index.html" already covers every directory that has a
# landing page; "$uri/" only adds the case of a directory that has none, where
# nginx -- with autoindex off, as it should be -- answers 403 rather than falling
# through to 404. This site has 35 archived documentation versions and none of
# their roots (/docs/v0.11.0/, ...) has an index page, matching upstream. A 403
# on those would be actively misleading here, since it reads as the permission
# failure the unprivileged runtime image can genuinely produce.
server {
    listen 8080;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html index.htm;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
