# Astro/Starlight emits a directory per page containing index.html, with
# trailingSlash: 'always'.
#
# Note the absence of a bare "$uri/" from try_files, which most of the other
# sites in this repo still carry. "$uri/index.html" already covers every
# directory that has a landing page; "$uri/" only adds the case of a directory
# that has none, where nginx -- with autoindex off, as it should be -- answers
# 403 rather than falling through to 404. Starlight sidebar groups are exactly
# that: /administration/ and /usage/ are grouping levels with no page of their
# own (the same is true upstream), so leaving "$uri/" in place turned every one
# of them into a misleading 403, which reads as the permission failure the
# unprivileged runtime image can genuinely produce.
server {
    listen 8080;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html index.htm;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
